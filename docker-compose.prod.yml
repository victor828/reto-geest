services:
  api:
    build:
      context: .
      target: prod
    image: reto-geest:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      STAGE: prod
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reto_geest
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node_modules/.bin/prisma migrate deploy && node dist/main"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reto_geest
    volumes:
      - db_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_prod_data:
